<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Backdraft - Pedidos</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <img src="logo-3d-backdraft.png" alt="3D Backdraft" />
      <div>
        <strong>Pedidos</strong>
        <span>3D Backdraft</span>
      </div>
    </div>

    <div class="top-actions">
      <button id="newOrderBtn" class="primary compact">+ Pedido</button>
      <button id="syncBtn" class="icon-btn" title="Actualizar">↻</button>
    </div>

  </header>

  <main>

    <nav class="view-tabs" aria-label="Vistas">
      <button class="view-tab active" data-view="pedidos">Pedidos</button>
      <button class="view-tab" data-view="ventas">Ventas</button>
      <button class="view-tab" data-view="billetera-iri">Billetera Iri</button>
      <button class="view-tab" data-view="billetera-mama">Billetera mama</button>
    </nav>

    <section id="statusMsg" class="status-msg"></section>

    <section id="ordersView">

      <section class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="Buscar producto, cliente o nota..."
        />

        <label class="sort-control">
          <span>Ordenar</span>

          <select id="sortSelect">
            <option value="nuevos">Mas nuevos primero</option>
            <option value="viejos">Mas viejos primero</option>
            <option value="cliente">Cliente A-Z</option>
            <option value="deuda">Mayor deuda primero</option>
            <option value="monto">Mayor venta primero</option>
          </select>
        </label>

      </section>

      <nav class="tabs" aria-label="Estados de pedidos">
        <button class="tab active" data-filter="Para hacer"><span>🖨️</span><b>Para hacer</b></button>
        <button class="tab" data-filter="Para entregar"><span>🚗</span><b>Para entregar</b></button>
        <button class="tab" data-filter="Para cobrar"><span>💵</span><b>Para cobrar</b></button>
        <button class="tab" data-filter="Deudor"><span>⚠️</span><b>Deudores</b></button>
        <button class="tab" data-filter="Todos"><span>📋</span><b>Activos</b></button>
      </nav>

      <section id="ordersList" class="orders-list"></section>

      <section class="summary-wrap" aria-label="Resumen de pedidos">
        <h2>Recuento</h2>
        <section class="summary" id="summary"></section>
      </section>

    </section>

    <section id="salesView" class="hidden">

      <section class="toolbar section-toolbar">
        <div>
          <p class="eyebrow mini">Ingresos</p>
          <h2>Ventas sin pedido</h2>
        </div>

        <button id="newSaleBtn" class="secondary compact" type="button">+ Venta</button>
      </section>

      <section id="salesList" class="movement-list"></section>

    </section>

    <section id="walletView" class="hidden">

      <section class="metrics-panel" aria-label="Billetera">
        <div class="panel-head">
          <div>
            <p class="eyebrow mini">Billetera</p>
            <h2 id="walletTitle">Billetera Iri</h2>
          </div>
          <div class="panel-actions">
            <button id="newSaleBtnInline" class="primary compact" type="button" onclick="document.getElementById('newSaleBtn').click()">+ Venta</button>
            <button id="newPurchaseBtn" class="secondary compact" type="button">+ Compra</button>
          </div>
        </div>

        <div class="wallet-filters">
          <label>
            Desde
            <input id="walletDateFrom" type="date" />
          </label>

          <label>
            Hasta
            <input id="walletDateTo" type="date" />
          </label>

          <button id="clearWalletDatesBtn" class="ghost" type="button">Todo</button>
        </div>

        <section class="metrics wallet-metrics" id="metrics"></section>
      </section>

      <section class="dashboard-grid wallet-grid">
        <section class="summary-wrap" aria-label="Historial de compras">
          <div class="inline-head">
            <h2>Historial de compras</h2>
            <button id="newPurchaseBtnInline" class="ghost mini-btn" type="button" onclick="document.getElementById('newPurchaseBtn').click()">+</button>
          </div>
          <section class="purchase-list" id="purchaseList"></section>
        </section>

        <section class="summary-wrap" aria-label="Historial de ingresos">
          <div class="inline-head">
            <h2>Historial de ingresos</h2>
            <button class="ghost mini-btn" type="button" onclick="document.getElementById('newSaleBtn').click()">+</button>
          </div>
          <section class="movement-list" id="incomeList"></section>
        </section>

        <section class="summary-wrap wide-panel" aria-label="Lectura de billetera">
          <h2>Lectura rapida</h2>
          <section class="wallet-notes" id="walletNotes"></section>
        </section>
      </section>

    </section>

  </main>

  <dialog id="orderDialog">

    <form id="orderForm" method="dialog" class="form-card">

      <div class="dialog-head">
        <div>
          <p class="eyebrow mini">Carga rapida</p>
          <h2 id="dialogTitle">Nuevo pedido</h2>
        </div>

        <button type="button" id="closeDialogBtn" class="ghost">×</button>
      </div>

      <input type="hidden" id="orderId" />

      <label>
        Producto / pedido *
        <textarea
          id="pedido"
          rows="3"
          placeholder="Ej: 10 llaveros bomberos + nombres"
          required
        ></textarea>
      </label>

      <label>
        Para quien
        <input
          id="cliente"
          type="text"
          placeholder="Opcional"
        />
      </label>

      <div class="grid-3">

        <label>
          Precio unitario
          <input
            id="precioUnitario"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          />
        </label>

        <label>
          Cantidad
          <input
            id="cantidad"
            type="number"
            min="1"
            step="1"
            placeholder="1"
          />
        </label>

        <label>
          Precio total
          <input
            id="precioTotal"
            type="number"
            min="0"
            step="1"
            placeholder="0"
          />
        </label>

      </div>

      <label>
        Seña / pagado
        <input
          id="sena"
          type="number"
          min="0"
          step="1"
          placeholder="Opcional"
        />
      </label>

      <div class="grid-2">
        <label>
          Parte Iri
          <input
            id="shareIri"
            type="number"
            min="0"
            step="1"
            placeholder="50% automatico"
          />
        </label>

        <label>
          Parte mama
          <input
            id="shareMama"
            type="number"
            min="0"
            step="1"
            placeholder="50% automatico"
          />
        </label>
      </div>

      <label id="stateField">
        Estado
        <select id="estado">
          <option>Para hacer</option>
          <option>Para entregar</option>
          <option>Para cobrar</option>
          <option>Deudor</option>
          <option>Finalizado</option>
        </select>
      </label>

      <label>
        Nota
        <textarea
          id="nota"
          rows="2"
          placeholder="Color, entrega, medidas, link de referencia, etc."
        ></textarea>
      </label>

      <button class="primary full" type="submit">
        Guardar en Sheet
      </button>

    </form>

  </dialog>

  <dialog id="saleDialog">

    <form id="saleForm" method="dialog" class="form-card">

      <div class="dialog-head">
        <div>
          <p class="eyebrow mini">Ventas</p>
          <h2 id="saleDialogTitle">Nueva venta</h2>
        </div>

        <button type="button" id="closeSaleDialogBtn" class="ghost">×</button>
      </div>

      <input type="hidden" id="saleId" />
      <input type="hidden" id="saleType" value="Venta" />
      <input type="hidden" id="saleOrderId" />

      <label>
        Fecha
        <input id="saleDate" type="date" />
      </label>

      <label>
        Billetera
        <select id="saleWallet">
          <option value="iri">Billetera Iri</option>
          <option value="mama">Billetera mama</option>
        </select>
      </label>

      <label>
        Detalle *
        <input
          id="saleDetail"
          type="text"
          placeholder="Ej: venta en feria, pieza suelta, seña extra..."
          required
        />
      </label>

      <label id="saleTotalField">
        Total venta *
        <input
          id="saleAmount"
          type="number"
          min="0"
          step="1"
          placeholder="0"
          required
        />
      </label>

      <div id="saleSplitFields" class="grid-2">
        <label>
          Para Iri
          <input
            id="saleShareIri"
            type="number"
            min="0"
            step="1"
            placeholder="50% automatico"
          />
        </label>

        <label>
          Para mama
          <input
            id="saleShareMama"
            type="number"
            min="0"
            step="1"
            placeholder="50% automatico"
          />
        </label>
      </div>

      <label>
        Referencia
        <input
          id="saleReference"
          type="text"
          placeholder="Cliente, medio de pago, nota corta..."
        />
      </label>

      <button class="primary full" type="submit">
        Guardar venta
      </button>

    </form>

  </dialog>

  <dialog id="purchaseDialog">

    <form id="purchaseForm" method="dialog" class="form-card">

      <div class="dialog-head">
        <div>
          <p class="eyebrow mini">Compras</p>
          <h2 id="purchaseDialogTitle">Nueva compra</h2>
        </div>

        <button type="button" id="closePurchaseDialogBtn" class="ghost">×</button>
      </div>

      <input type="hidden" id="purchaseId" />

      <label>
        Fecha
        <input id="purchaseDate" type="date" />
      </label>

      <label>
        Billetera
        <select id="purchaseWallet">
          <option value="iri">Billetera Iri</option>
          <option value="mama">Billetera mama</option>
        </select>
      </label>

      <label>
        Que se compro *
        <input
          id="purchaseConcept"
          type="text"
          placeholder="Filamento, repuesto, embalaje..."
          required
        />
      </label>

      <label>
        Monto *
        <input
          id="purchaseAmount"
          type="number"
          min="0"
          step="1"
          placeholder="0"
          required
        />
      </label>

      <label>
        Nota
        <textarea
          id="purchaseNote"
          rows="2"
          placeholder="Proveedor, color, cantidad, motivo..."
        ></textarea>
      </label>

      <button class="primary full" type="submit">
        Guardar compra
      </button>

    </form>

  </dialog>

  <script src="app.js?v=10"></script>

</body>
</html>
